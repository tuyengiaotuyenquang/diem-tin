<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Điểm tin & Lắng nghe dư luận · Ban Tuyên giáo Tỉnh ủy Tuyên Quang</title>
<link rel="icon" href="Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --do:#C8102E; --do-dam:#9E0B23; --do-nhat:#FDECEF;
  --vang:#F5A623; --vang-nhat:#FFF6E5;
  --navy:#0D1B2A; --chu:#1E293B; --chu-phu:#64748B; --chu-mo:#94A3B8;
  --vien:#E8ECF2; --nen:#F6F7F9; --trang:#FFFFFF;
  --xanh:#16A34A; --cam:#D97706; --doo:#DC2626;
  --cao-header:72px; --cao-tab:54px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--chu);background:var(--nen);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}
button{font-family:inherit;cursor:pointer}

/* ===== HEADER ===== */
.header{position:relative;height:var(--cao-header);background:var(--trang);display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--vien)}
.header::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--do) 0%,var(--do) 55%,var(--vang) 100%)}
.logo{width:46px;height:46px;flex:none;object-fit:contain}
.logo-du-phong{width:46px;height:46px;flex:none;border-radius:50%;background:var(--do);display:none;align-items:center;justify-content:center}
.ten{min-width:0}
.ten .co-quan{font-size:11.5px;font-weight:800;letter-spacing:1.4px;color:var(--do);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ten h1{font-size:21px;font-weight:900;color:var(--navy);letter-spacing:-.2px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ten h1 span{color:var(--do)}
.header-phai{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.cap-nhat{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--chu-phu);background:var(--nen);border:1px solid var(--vien);padding:7px 12px;border-radius:999px}
.cham-song{width:8px;height:8px;border-radius:50%;background:var(--do);box-shadow:0 0 0 0 rgba(200,16,46,.5);animation:song 1.8s infinite}
@keyframes song{0%{box-shadow:0 0 0 0 rgba(200,16,46,.45)}70%{box-shadow:0 0 0 8px rgba(200,16,46,0)}100%{box-shadow:0 0 0 0 rgba(200,16,46,0)}}
.nut-icon{width:38px;height:38px;border-radius:10px;border:1px solid var(--vien);background:var(--trang);display:flex;align-items:center;justify-content:center;color:var(--navy);transition:.15s}
.nut-icon:hover{border-color:var(--do);color:var(--do)}
.nut-icon.dang-quay svg{animation:quay .8s linear infinite}
@keyframes quay{to{transform:rotate(360deg)}}

/* ===== TABS ===== */
.tabs{height:var(--cao-tab);background:var(--trang);border-bottom:1px solid var(--vien);display:flex;align-items:flex-end;gap:4px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;border:0;background:none;padding:0 14px 15px;font-size:13.5px;font-weight:700;color:var(--chu-phu);display:flex;align-items:center;gap:8px;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--navy)}
.tab .so{font-size:11px;font-weight:800;min-width:24px;padding:2px 7px;border-radius:999px;background:var(--nen);color:var(--chu-phu);text-align:center}
.tab.chon{color:var(--do)}
.tab.chon .so{background:var(--do);color:#fff}
.tab.chon::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--do)}

/* ===== BỐ CỤC 2 CỘT ===== */
.khung{display:grid;grid-template-columns:minmax(340px,430px) 1fr;height:calc(100vh - var(--cao-header) - var(--cao-tab));height:calc(100dvh - var(--cao-header) - var(--cao-tab))}
.cot-trai{background:var(--trang);border-right:1px solid var(--vien);overflow-y:auto;overscroll-behavior:contain}
.cot-phai{overflow-y:auto;overscroll-behavior:contain;background:var(--nen)}

/* ===== THỐNG KÊ MXH ===== */
.thong-ke{margin:16px 16px 4px;padding:16px;border:1px solid var(--vien);border-radius:14px;background:linear-gradient(180deg,#fff,#FCFCFD)}
.thong-ke h3{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--navy);margin-bottom:12px}
.tk-than{display:flex;align-items:center;gap:18px}
.donut{flex:none;position:relative;width:104px;height:104px}
.donut svg{transform:rotate(-90deg)}
.donut .giua{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .giua b{font-size:22px;font-weight:900;color:var(--navy);line-height:1}
.donut .giua small{font-size:10.5px;color:var(--chu-phu);font-weight:600;margin-top:3px}
.chu-giai{flex:1;display:flex;flex-direction:column;gap:7px}
.dong-cg{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.dong-cg i{width:10px;height:10px;border-radius:3px;flex:none}
.dong-cg span{margin-left:auto;font-weight:800;color:var(--navy)}
.dong-cg em{font-style:normal;color:var(--chu-mo);font-weight:600;font-size:12px;width:36px;text-align:right}
.canh-bao{margin-top:12px;padding:9px 12px;border-radius:10px;background:var(--do-nhat);color:var(--doo);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px}

/* ===== DANH SÁCH TIN ===== */
.ds-dau{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px 10px;font-size:12px;font-weight:700;color:var(--chu-phu)}
.ds-dau b{color:var(--navy)}
.ds{list-style:none;padding-bottom:24px}
.tin{position:relative;display:block;width:100%;text-align:left;border:0;background:none;padding:13px 18px 13px 20px;border-top:1px solid #F0F2F6;transition:background .12s}
.tin:hover{background:#FAFBFC}
.tin::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:transparent;transition:.12s}
.tin.chon{background:var(--do-nhat)}
.tin.chon::before{background:var(--do)}
.tin-tieu-de{font-size:14.5px;font-weight:700;line-height:1.45;color:var(--navy);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tin.chon .tin-tieu-de{color:var(--do-dam)}
.tin-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:7px;font-size:12px;color:var(--chu-phu);font-weight:500}
.tin-meta .nguon{font-weight:700;color:#334155;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tin-meta .cham{width:3px;height:3px;border-radius:50%;background:var(--chu-mo)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid;letter-spacing:.2px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.tich-cuc{color:var(--xanh);background:#F0FDF4;border-color:#BBF7D0}
.pill.trung-lap{color:var(--cam);background:#FFFBEB;border-color:#FDE68A}
.pill.tieu-cuc{color:var(--doo);background:#FEF2F2;border-color:#FECACA}
.trong{padding:48px 24px;text-align:center;color:var(--chu-phu);font-size:14px;line-height:1.6}
.trong b{display:block;color:var(--navy);font-size:15px;margin-bottom:4px}
.khung-xuong{padding:14px 18px 14px 20px;border-top:1px solid #F0F2F6}
.xuong{height:12px;border-radius:6px;background:linear-gradient(90deg,#EEF1F5 0%,#F7F8FA 50%,#EEF1F5 100%);background-size:200% 100%;animation:anh-sang 1.2s infinite;margin-bottom:8px}
@keyframes anh-sang{to{background-position:-200% 0}}

/* ===== KHUNG ĐỌC ===== */
.doc-thanh-tren{display:none}
.chua-chon{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--chu-phu);padding:24px}
.chua-chon img{width:88px;height:88px;object-fit:contain;opacity:.9}
.chua-chon h2{font-size:18px;color:var(--navy);font-weight:800}
.chua-chon p{font-size:14px;max-width:360px;line-height:1.6}
.bai{max-width:780px;margin:28px auto 48px;background:var(--trang);border:1px solid var(--vien);border-radius:18px;padding:36px 44px 40px;box-shadow:0 8px 28px rgba(13,27,42,.05)}
.bai-muc{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--do);margin-bottom:12px}
.bai-muc::before{content:"";width:18px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--do),var(--vang))}
.bai h2{font-family:'Noto Serif',Georgia,serif;font-size:29px;line-height:1.32;font-weight:700;color:var(--navy);letter-spacing:-.2px}
.bai-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:16px 0 20px;font-size:13px;color:var(--chu-phu);font-weight:500}
.bai-meta .nguon{font-weight:800;color:var(--navy)}
.bai-nut{display:flex;flex-wrap:wrap;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--vien);margin-bottom:24px}
.nut{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-size:13.5px;font-weight:700;text-decoration:none;border:1px solid var(--vien);background:var(--trang);color:var(--navy);transition:.15s}
.nut:hover{border-color:var(--navy)}
.nut.chinh{background:var(--do);border-color:var(--do);color:#fff;box-shadow:0 4px 12px rgba(200,16,46,.25)}
.nut.chinh:hover{background:var(--do-dam);border-color:var(--do-dam)}
.bai-anh{width:100%;max-height:440px;object-fit:cover;border-radius:12px;margin-bottom:22px;background:var(--nen)}
.bai-sapo{font-size:17px;font-weight:700;line-height:1.65;color:#1E293B;margin-bottom:18px}
.bai-noi-dung p{font-family:'Noto Serif',Georgia,serif;font-size:17.5px;line-height:1.8;color:#1F2937;margin-bottom:16px;text-align:justify;hyphens:auto}
.bai-chu-thich{margin-top:28px;padding:14px 16px;border-radius:12px;background:var(--vang-nhat);border:1px solid #FBE3B6;font-size:13px;line-height:1.6;color:#7C5410}
.bai-chu-thich b{color:#5B3D0A}
.hop-loi{padding:18px;border-radius:12px;background:var(--nen);border:1px dashed #CBD5E1;font-size:14.5px;line-height:1.65;color:#334155}
.hop-loi > b:first-child{display:block;color:var(--navy);margin-bottom:6px}
.thong-bao{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--navy);color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:200}
.thong-bao.hien{opacity:1;transform:translate(-50%,0)}

/* ===== ĐIỆN THOẠI ===== */
@media (max-width: 860px){
  :root{--cao-header:62px;--cao-tab:50px}
  .header{padding:0 14px;gap:10px}
  .logo,.logo-du-phong{width:38px;height:38px}
  .ten .co-quan{font-size:9.5px;letter-spacing:.8px}
  .ten h1{font-size:16px}
  .cap-nhat .chu{display:none}
  .cap-nhat{padding:8px}
  .tabs{padding:0 8px}
  .tab{padding:0 11px 13px;font-size:12.5px}
  .khung{grid-template-columns:1fr}
  .cot-trai{border-right:0}
  .cot-phai{position:fixed;inset:0;z-index:100;background:var(--trang);transform:translateX(100%);transition:transform .25s ease;visibility:hidden}
  .cot-phai.mo{transform:none;visibility:visible}
  .doc-thanh-tren{display:flex;position:sticky;top:0;z-index:2;align-items:center;gap:8px;height:56px;padding:0 10px;padding-top:env(safe-area-inset-top);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--vien)}
  .nut-quay-lai{display:flex;align-items:center;gap:4px;height:40px;padding:0 10px 0 4px;border:0;background:none;font-size:15px;font-weight:700;color:var(--do)}
  .doc-thanh-tren .nut-icon{margin-left:auto}
  .chua-chon{display:none}
  .bai{margin:0;border:0;border-radius:0;box-shadow:none;padding:20px 18px 48px}
  .bai h2{font-size:23px}
  .bai-noi-dung p{font-size:17px;text-align:left}
  .bai-nut .nut{flex:1;justify-content:center}
}
</style>
</head>
<body>

<header class="header">
  <img class="logo" id="logo" src="Logo.png" alt="" onerror="if(!this.dataset.thu){this.dataset.thu=1;this.src='logo.png'}else{this.style.display='none';document.getElementById('logoDuPhong').style.display='flex'}">
  <div class="logo-du-phong" id="logoDuPhong">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#F5A623"><path d="M12 2l2.9 6.9L22 9.3l-5.4 4.8L18.2 22 12 18.3 5.8 22l1.6-7.9L2 9.3l7.1-.4z"/></svg>
  </div>
  <div class="ten">
    <div class="co-quan">Ban Tuyên giáo Tỉnh ủy Tuyên Quang</div>
    <h1>Điểm tin & <span>Lắng nghe dư luận</span></h1>
  </div>
  <div class="header-phai">
    <div class="cap-nhat" title="Thời điểm hệ thống quét tin gần nhất"><span class="cham-song"></span><span class="chu" id="capNhat">Đang tải…</span></div>
    <button class="nut-icon" id="nutLamMoi" title="Tải lại danh sách" aria-label="Tải lại danh sách">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist"></nav>

<main class="khung">
  <section class="cot-trai" id="cotTrai" aria-label="Danh sách tin"></section>
  <section class="cot-phai" id="cotPhai" aria-label="Nội dung tin">
    <div class="doc-thanh-tren">
      <button class="nut-quay-lai" id="nutQuayLai">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Danh sách
      </button>
      <a class="nut-icon" id="nutGocMobile" target="_blank" rel="noopener" title="Mở trang gốc" aria-label="Mở trang gốc">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
      </a>
    </div>
    <div id="noiDungDoc">
      <div class="chua-chon">
        <img src="Logo.png" alt="" onerror="if(!this.dataset.thu){this.dataset.thu=1;this.src='logo.png'}else{this.style.display='none'}">
        <h2>Chọn một tin để đọc</h2>
        <p>Bấm vào tin bất kỳ ở danh sách bên trái, nội dung bài sẽ hiện ngay tại đây.</p>
      </div>
    </div>
  </section>
</main>

<div class="thong-bao" id="thongBao"></div>

<script>
/* =====================================================================
   CẤU HÌNH — dùng anon key (khóa công khai, chỉ ĐỌC được nhờ RLS)
   ===================================================================== */
const SUPABASE_URL = "https://elkysoeukqtweytkekwr.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsa3lzb2V1a3F0d2V5dGtla3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNDI1NzgsImV4cCI6MjEwNzYxODU3OH0.sNDvKU81uqr7P6kXAdAeyhgzDcR7Htz_QP66ZJLjvj0";

// Khóa kiểu cũ (eyJ...) gửi thêm Authorization; khóa kiểu mới (sb_publishable_...) chỉ gửi apikey
const HEADERS_SB = SUPABASE_ANON.startsWith("eyJ")
  ? { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` }
  : { apikey: SUPABASE_ANON };

const MUC = [
  { ma: "tieudiem",  ten: "Tiêu điểm 24h", nhan: "Trong nước",   ngay: 2,  gioiHan: 50,  mota: "tin nổi bật trong nước" },
  { ma: "quocte",    ten: "Quốc tế",       nhan: "Quốc tế",      ngay: 3,  gioiHan: 50,  mota: "tin thế giới" },
  { ma: "mxh",       ten: "Dư luận MXH",   nhan: "Mạng xã hội",  ngay: 2,  gioiHan: 80,  mota: "tin 48 giờ gần nhất" },
  { ma: "diaphuong", ten: "Địa phương",    nhan: "Địa phương",   ngay: 14, gioiHan: 200, mota: "quét toàn bộ 124 xã, phường" },
  { ma: "tuyengiao", ten: "Tuyên giáo TW", nhan: "Tuyên giáo",   ngay: 3,  gioiHan: 50,  mota: "tin Tuyên giáo, Dân vận Trung ương" },
];

/* ===================================================================== */
const $ = (s) => document.querySelector(s);
const laDienThoai = () => window.matchMedia("(max-width: 860px)").matches;
const duLieu = {};           // ma muc -> danh sách tin
const boNhoBai = new Map();  // khoa -> bài đầy đủ
let mucChon = MUC.some(m => m.ma === location.hash.slice(1)) ? location.hash.slice(1) : "diaphuong";
let baiChon = null;
let loiTai = "";

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function linkAnToan(u) { return /^https?:\/\//i.test(u || "") ? u : null; }

async function api(duongDan) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${duongDan}`, {
    headers: HEADERS_SB,
  });
  if (!r.ok) {
    let chiTiet = "";
    try { const j = await r.json(); chiTiet = j.message || j.hint || ""; } catch (e) {}
    if (/dt_bai/.test(chiTiet) && /(not find|does not exist|schema cache)/i.test(chiTiet))
      chiTiet = "Chưa có bảng dt_bai trên Supabase (chưa chạy file schema.sql, hoặc chạy ở project khác).";
    else if (r.status === 401) chiTiet = SUPABASE_ANON.startsWith("DAN_KHOA")
      ? "Chưa điền khóa anon vào dòng SUPABASE_ANON trong index.html."
      : "Khóa SUPABASE_ANON không đúng với project Supabase (chép thiếu, thừa dấu cách hoặc khóa của project khác).";
    throw new Error(`Lỗi ${r.status}${chiTiet ? ": " + chiTiet : ""}`);
  }
  return r.json();
}

function thoiGianTuongDoi(iso) {
  if (!iso) return "";
  const giay = (Date.now() - new Date(iso).getTime()) / 1000;
  if (giay < 60) return "vừa xong";
  if (giay < 3600) return `${Math.floor(giay / 60)} phút trước`;
  if (giay < 86400) return `${Math.floor(giay / 3600)} giờ trước`;
  if (giay < 86400 * 7) return `${Math.floor(giay / 86400)} ngày trước`;
  return new Date(iso).toLocaleDateString("vi-VN");
}
function thoiGianDayDu(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const thu = ["Chủ nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"][d.getDay()];
  return `${thu}, ${d.toLocaleDateString("vi-VN")} · ${d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })}`;
}
function pillCamXuc(cx) {
  const lop = cx === "Tích cực" ? "tich-cuc" : cx === "Tiêu cực" ? "tieu-cuc" : "trung-lap";
  return `<span class="pill ${lop}"><i></i>${esc(cx || "Trung lập")}</span>`;
}
function thongBao(chu) {
  const el = $("#thongBao");
  el.textContent = chu; el.classList.add("hien");
  clearTimeout(thongBao._t); thongBao._t = setTimeout(() => el.classList.remove("hien"), 2200);
}

/* ===================== TẢI DỮ LIỆU ===================== */
async function taiMuc(m) {
  const tu = new Date(Date.now() - m.ngay * 86400000).toISOString();
  const cot = "khoa,tieu_de,nguon,cam_xuc,thoi_gian";
  const locTinh = (m.ma === "diaphuong" || m.ma === "mxh") ? "&ngoai_tinh=is.false" : "";
  duLieu[m.ma] = await api(`dt_bai?select=${cot}&muc=cs.%7B${m.ma}%7D${locTinh}&thoi_gian=gte.${encodeURIComponent(tu)}&order=thoi_gian.desc&limit=${m.gioiHan}`);
}

async function taiTatCa() {
  loiTai = "";
  $("#nutLamMoi").classList.add("dang-quay");
  if (!duLieu[mucChon]) veKhungXuong();
  try {
    await Promise.all([
      ...MUC.map(m => taiMuc(m).catch((e) => { loiTai = e.message || "Không kết nối được máy chủ."; duLieu[m.ma] = duLieu[m.ma] || null; })),
      api("dt_bai?select=quet_luc&order=quet_luc.desc&limit=1").then(r => {
        $("#capNhat").textContent = r[0] ? `Cập nhật ${thoiGianTuongDoi(r[0].quet_luc)}` : "Chưa có dữ liệu";
      }).catch(() => { $("#capNhat").textContent = "Mất kết nối"; }),
    ]);
  } finally {
    $("#nutLamMoi").classList.remove("dang-quay");
  }
  veTabs();
  veDanhSach();
}

/* ===================== VẼ TABS ===================== */
function veTabs() {
  $("#tabs").innerHTML = MUC.map(m => {
    const n = Array.isArray(duLieu[m.ma]) ? duLieu[m.ma].length : "–";
    return `<button class="tab ${m.ma === mucChon ? "chon" : ""}" role="tab" data-muc="${m.ma}" aria-selected="${m.ma === mucChon}">${esc(m.ten)}<span class="so">${n}</span></button>`;
  }).join("");
  const dangChon = $("#tabs .tab.chon");
  if (dangChon) dangChon.scrollIntoView({ block: "nearest", inline: "nearest" });
}
$("#tabs").addEventListener("click", (e) => {
  const t = e.target.closest(".tab");
  if (!t || t.dataset.muc === mucChon) return;
  mucChon = t.dataset.muc;
  history.replaceState(null, "", "#" + mucChon);
  veTabs();
  veDanhSach();
  $("#cotTrai").scrollTop = 0;
});

/* ===================== VẼ DANH SÁCH ===================== */
function veKhungXuong() {
  $("#cotTrai").innerHTML = Array.from({ length: 8 }, () =>
    `<div class="khung-xuong"><div class="xuong" style="width:92%"></div><div class="xuong" style="width:70%"></div><div class="xuong" style="width:35%;height:9px;margin:10px 0 0"></div></div>`).join("");
}

function veThongKe(ds) {
  const dem = { "Tích cực": 0, "Trung lập": 0, "Tiêu cực": 0 };
  ds.forEach(t => { dem[t.cam_xuc in dem ? t.cam_xuc : "Trung lập"]++; });
  const tong = ds.length || 1;
  const mau = { "Tích cực": "#16A34A", "Trung lập": "#F5A623", "Tiêu cực": "#DC2626" };
  const R = 42, C = 2 * Math.PI * R;
  let daVe = 0;
  const cung = Object.keys(dem).map(k => {
    const dai = (dem[k] / tong) * C;
    const s = dem[k] ? `<circle cx="52" cy="52" r="${R}" fill="none" stroke="${mau[k]}" stroke-width="13" stroke-dasharray="${Math.max(dai - 2, 0)} ${C}" stroke-dashoffset="${-daVe}"/>` : "";
    daVe += dai;
    return s;
  }).join("");
  const dong = Object.keys(dem).map(k =>
    `<div class="dong-cg"><i style="background:${mau[k]}"></i>${k}<span>${dem[k]}</span><em>${Math.round(dem[k] / tong * 100)}%</em></div>`).join("");
  return `
    <div class="thong-ke">
      <h3>Sắc thái dư luận · 48 giờ qua</h3>
      <div class="tk-than">
        <div class="donut">
          <svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="${R}" fill="none" stroke="#F1F4F8" stroke-width="13"/>${cung}</svg>
          <div class="giua"><b>${ds.length}</b><small>tin, bài</small></div>
        </div>
        <div class="chu-giai">${dong}</div>
      </div>
      ${dem["Tiêu cực"] ? `<div class="canh-bao">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        Cảnh báo: ${dem["Tiêu cực"]} tin có sắc thái tiêu cực</div>` : ""}
    </div>`;
}

function veDanhSach() {
  const m = MUC.find(x => x.ma === mucChon);
  const ds = duLieu[mucChon];
  const cot = $("#cotTrai");
  if (ds === undefined) { veKhungXuong(); return; }
  if (ds === null) {
    cot.innerHTML = `<div class="trong"><b>Không tải được dữ liệu</b>${esc(loiTai || "Kiểm tra kết nối mạng rồi bấm nút tải lại ở góc trên.")}</div>`;
    return;
  }
  let html = mucChon === "mxh" && ds.length ? veThongKe(ds) : "";
  if (!ds.length) {
    cot.innerHTML = html + `<div class="trong"><b>Chưa có tin</b>Chưa có tin, bài mới cho mục ${esc(m.ten)} trong ${m.ngay} ngày qua.</div>`;
    return;
  }
  html += `<div class="ds-dau"><span><b>${ds.length}</b> tin · ${esc(m.mota)}</span><span>Mới nhất trước</span></div><ul class="ds">`;
  html += ds.map(t => `
    <li><button class="tin ${t.khoa === baiChon ? "chon" : ""}" data-khoa="${esc(t.khoa)}">
      <div class="tin-tieu-de">${esc(t.tieu_de)}</div>
      <div class="tin-meta">
        ${mucChon === "mxh" ? pillCamXuc(t.cam_xuc) : ""}
        ${t.nguon ? `<span class="nguon">${esc(t.nguon)}</span><span class="cham"></span>` : ""}
        <span title="${esc(thoiGianDayDu(t.thoi_gian))}">${esc(thoiGianTuongDoi(t.thoi_gian))}</span>
      </div>
    </button></li>`).join("");
  cot.innerHTML = html + "</ul>";
}

$("#cotTrai").addEventListener("click", (e) => {
  const b = e.target.closest(".tin");
  if (b) moBai(b.dataset.khoa);
});

/* ===================== KHUNG ĐỌC ===================== */
async function moBai(khoa) {
  baiChon = khoa;
  document.querySelectorAll(".tin.chon").forEach(x => x.classList.remove("chon"));
  const nut = document.querySelector(`.tin[data-khoa="${CSS.escape(khoa)}"]`);
  if (nut) nut.classList.add("chon");

  if (laDienThoai() && !$("#cotPhai").classList.contains("mo")) {
    $("#cotPhai").classList.add("mo");
    history.pushState({ docBai: true }, "", location.hash || "#" + mucChon);
  }

  const tomTat = Object.values(duLieu).flat().find(t => t && t.khoa === khoa) || {};
  if (!boNhoBai.has(khoa)) {
    veBai({ ...tomTat, dangTai: true });
    try {
      const r = await api(`dt_bai?select=*&khoa=eq.${encodeURIComponent(khoa)}`);
      if (r[0]) boNhoBai.set(khoa, r[0]);
    } catch (e) {
      if (baiChon === khoa) veBai({ ...tomTat, loiTai: true });
      return;
    }
  }
  if (baiChon === khoa) veBai(boNhoBai.get(khoa) || { ...tomTat, loiTai: true });
}

// Cắt danh sách "Tin liên quan / Tin cùng chuyên mục" mà một số báo để lẫn trong thân bài,
// bỏ các đoạn chỉ có dấu gạch (áp dụng cả cho bài đã lưu từ trước)
const MOC_PHAN_THUA = new Set(["tin liên quan", "tin cùng chuyên mục", "tin khác", "các tin khác",
  "xem thêm", "đọc thêm", "bài liên quan", "bài viết liên quan", "có thể bạn quan tâm", "tin mới nhất",
  "tin đọc nhiều", "tin nổi bật", "tin mới", "cùng chuyên mục", "tin tức liên quan"]);
function catPhanThua(doan) {
  const kq = [];
  for (let i = 0; i < doan.length; i++) {
    const chuan = doan[i].normalize("NFC").toLowerCase().replace(/\s+/g, " ").replace(/^[\s:.\-–>»]+|[\s:.\-–>»]+$/g, "");
    if (i >= 2 && MOC_PHAN_THUA.has(chuan)) break;
    if (/^[\s\-–—_•·*|]+$/.test(doan[i])) continue;
    kq.push(doan[i]);
  }
  return kq;
}

function veBai(b) {
  const m = MUC.find(x => x.ma === mucChon);
  const link = linkAnToan(b.link_goc) || linkAnToan(b.link_rss);
  const gocMobile = $("#nutGocMobile");
  if (link) { gocMobile.href = link; gocMobile.style.visibility = "visible"; } else gocMobile.style.visibility = "hidden";

  let than = "";
  if (b.dangTai) {
    than = `<div class="xuong" style="width:100%;height:220px;border-radius:12px;margin-bottom:22px"></div>` +
      [96, 100, 88, 100, 72].map(w => `<div class="xuong" style="width:${w}%;height:14px;margin-bottom:12px"></div>`).join("");
  } else if (b.loiTai) {
    than = `<div class="hop-loi"><b>Không tải được nội dung</b>Kiểm tra kết nối mạng rồi bấm lại vào tin.</div>`;
  } else if (b.trang_thai === "ok" && b.noi_dung) {
    const tieuDeChuan = (b.tieu_de || "").trim().toLowerCase();
    const doan = catPhanThua(b.noi_dung.split(/\n{2,}/).map(s => s.trim()).filter(Boolean))
      .filter((d, i) => !(i < 2 && tieuDeChuan.startsWith(d.toLowerCase())));
    const anh = linkAnToan(b.anh);
    than = (anh ? `<img class="bai-anh" src="${esc(anh)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "") +
      (b.tom_tat && !b.noi_dung.startsWith(b.tom_tat.slice(0, 60)) ? `<p class="bai-sapo">${esc(b.tom_tat)}</p>` : "") +
      `<div class="bai-noi-dung">${doan.map(d => `<p>${esc(d)}</p>`).join("")}</div>` +
      `<div class="bai-chu-thich"><b>Nguồn: ${esc(b.nguon || "báo điện tử")}.</b> Nội dung được hệ thống trích tự động phục vụ theo dõi thông tin; hình ảnh, bảng biểu, video có thể không đầy đủ. Bấm <b>Đọc trang gốc</b> để xem bài nguyên bản trên báo.</div>`;
  } else {
    const lyDo = b.trang_thai === "cho" ? "Hệ thống đang lấy nội dung bài này, vui lòng quay lại sau ít phút."
      : "Trang báo này chặn việc lấy nội dung tự động.";
    than = (b.tom_tat ? `<p class="bai-sapo">${esc(b.tom_tat)}</p>` : "") +
      `<div class="hop-loi"><b>Chưa hiển thị được toàn văn</b>${lyDo} Bạn có thể bấm <b>Đọc trang gốc</b> để xem trực tiếp trên báo.</div>`;
  }

  $("#noiDungDoc").innerHTML = `
    <article class="bai">
      <div class="bai-muc">${esc(m ? m.nhan : "")}</div>
      <h2>${esc(b.tieu_de || "")}</h2>
      <div class="bai-meta">
        ${b.nguon ? `<span class="nguon">${esc(b.nguon)}</span>` : ""}
        <span>${esc(thoiGianDayDu(b.thoi_gian))}</span>
        ${mucChon === "mxh" ? pillCamXuc(b.cam_xuc) : ""}
      </div>
      <div class="bai-nut">
        ${link ? `<a class="nut chinh" href="${esc(link)}" target="_blank" rel="noopener">Đọc trang gốc
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg></a>
        <button class="nut" id="nutSaoChep">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Sao chép link</button>` : ""}
      </div>
      ${than}
    </article>`;
  $("#cotPhai").scrollTop = 0;

  const sc = $("#nutSaoChep");
  if (sc) sc.onclick = async () => {
    try { await navigator.clipboard.writeText(link); thongBao("Đã sao chép link bài báo"); }
    catch (e) { prompt("Sao chép link:", link); }
  };
}

/* ===================== ĐIỆN THOẠI: ĐÓNG KHUNG ĐỌC ===================== */
function dongKhungDoc() { $("#cotPhai").classList.remove("mo"); }
$("#nutQuayLai").addEventListener("click", () => {
  if (history.state && history.state.docBai) history.back(); else dongKhungDoc();
});
window.addEventListener("popstate", dongKhungDoc);  // nút Back của điện thoại

/* ===================== KHỞI ĐỘNG ===================== */
$("#nutLamMoi").addEventListener("click", () => { boNhoBai.clear(); taiTatCa(); });
veTabs();
taiTatCa();
setInterval(taiTatCa, 10 * 60 * 1000);   // tự làm mới 10 phút/lần

try {   // ghi lượt truy cập (giống bản Streamlit), mỗi phiên 1 lần
  if (!sessionStorage.getItem("dt_da_ghi")) {
    fetch(`${SUPABASE_URL}/rest/v1/thong_ke_truy_cap`, {
      method: "POST",
      headers: { ...HEADERS_SB, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ ten_app: "Điểm tin & Social Listening" }),
    }).catch(() => {});
    sessionStorage.setItem("dt_da_ghi", "1");
  }
} catch (e) {}
</script>
